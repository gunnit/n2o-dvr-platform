[alembic]
script_location = alembic
# alembic/env.py does `from app.config import settings`, but the alembic console
# script does not put the CWD on sys.path — so a bare `alembic upgrade head` from
# backend/ dies with ModuleNotFoundError: No module named 'app'. Render works around
# it per-command (render.yaml: `PYTHONPATH=. alembic upgrade head`, DEPLOY.md §3);
# this makes it work everywhere, including CI and local runs.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://postgres:dev@localhost:5432/n2o

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
