databases:
  - name: n2o-dvr-db
    plan: basic-256mb  # legacy 'starter' was retired; basic-256mb is the new entry tier
    region: frankfurt  # EU region — N2O client is Italian
    databaseName: n2o
    user: n2o_user
    ipAllowList: []    # internal-only; reached by n2o-dvr-api + n2o-dvr-worker over private network

services:
  - type: web
    name: n2o-dvr-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    # The docx generators read real .docx templates from backend/templates.
    # The repo keeps them at the root — rootDir is backend/, so ../templates
    # resolves to the repo's templates/ dir. See docx_utils._resolve_templates_dir.
    buildCommand: cp -r ../templates ./templates && pip install -r requirements.txt
    preDeployCommand: PYTHONPATH=. alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: n2o-dvr-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: n2o-dvr-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://dvr-sicurezza.it","https://www.dvr-sicurezza.it","https://n2o-dvr-frontend.onrender.com"]'
      - key: FILE_STORAGE_PATH
        value: /data
      # --- Billing (monetization Phase 4) ---------------------------------
      # PAYPAL_ENV picks the API host, so a sandbox credential shipped to
      # production fails to authenticate instead of quietly charging nobody.
      #
      # This is a production-only blueprint, so the value is pinned here rather
      # than left to the dashboard: a blueprint sync overwrites dashboard edits
      # for any key that is not `sync: false`.
      #
      # ⚠️ DELIBERATELY `sandbox` (2026-07-28, owner's decision). Production runs
      # the full purchase path against PayPal's sandbox so the whole funnel can
      # be walked end to end with test money before any real card is taken.
      # Consequences, all of which are intentional:
      #   * `plans.paypal_plan_id` in the production DB now holds SANDBOX ids.
      #     Plan ids are environment-specific, so switching this key to `live`
      #     REQUIRES re-running `scripts/paypal_setup.py --live` to reissue them
      #     and re-registering the webhook. Flipping the key alone silently
      #     breaks checkout — every id we hold becomes unrecognised.
      #   * No real money can be collected while this says `sandbox`.
      # The go-live switch is DEPLOY.md §4b.
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # From `python -m scripts.paypal_webhook_setup --url https://n2o-dvr-api.onrender.com`.
      # Until it is set, webhook signature verification fails closed and every
      # event is rejected — subscriptions will never activate.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Where PayPal returns the customer after approval. Must be the public
      # frontend origin or they land on a dead page mid-purchase.
      - key: FRONTEND_URL
        value: https://dvr-sicurezza.it
      # Comma-separated emails of the N2O staff who may run
      # `POST /billing/admin/organizations/{id}/plan` — the endpoint that puts a
      # tenant on a plan after an invoice is paid off PayPal. It names an
      # organization by id, so it is the one place a request reaches across
      # tenants, and it grants a plan for free.
      #
      # `sync: false` because it is the list of people who can do that, not a
      # deploy detail, and because it is the only gate: while it is empty
      # NOBODY can set a plan by hand — including us. Set it in the dashboard
      # before relying on manual provisioning (DEPLOY.md §4c).
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # The paywall (MB-2.6 / GATE 2). ON since 2026-07-28.
      #
      # What made it safe to flip: migration `e7f8a9b0c1d2` backfills an
      # `A_FOUNDING`/`active` subscription for every organization that lacked
      # one, so no existing tenant resolves to the unsubscribed state (INV-1).
      # Verified against production before flipping — `GET /billing/entitlements`
      # returned plan_code=A_FOUNDING, status=active, subscribed=true.
      #
      # With this true, an org with NO subscription row (i.e. a self-serve
      # signup that has not bought yet) gets 402 on document generation, on
      # creating an azienda, and on every AI endpoint. That is the funnel
      # working as designed — but it means a signup is a dead end unless the
      # plans are purchasable, so keep the PayPal provisioning in DEPLOY.md §4b
      # done. `app/main.py` logs a startup warning if this is true while PayPal
      # is unconfigured, which is exactly that dead end.
      - key: ENTITLEMENTS_ENFORCE
        value: "true"
      # The DVR Google Docs editing endpoints (/documenti/{id}/open-for-editing
      # + /sync-from-gdoc) run on the API service and need the same Drive
      # credentials + target folder as the worker. Upload a Secret File
      # named `token.json` to this service via the Render dashboard; without
      # it the endpoints return 503 with an Italian error message.
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 13aHCy8D78JwJzgffxYbqe7Nmyed84may
      - key: GOOGLE_DRIVE_TOKEN_JSON
        value: /etc/secrets/token.json
    disk:
      name: n2o-data
      mountPath: /data
      sizeGB: 1

  - type: worker
    name: n2o-dvr-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: cp -r ../templates ./templates && pip install -r requirements.txt
    startCommand: celery -A app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: n2o-dvr-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: n2o-dvr-redis
          type: redis
          property: connectionString
      - key: FILE_STORAGE_PATH
        value: /data
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 13aHCy8D78JwJzgffxYbqe7Nmyed84may
      # Point at a Render Secret File mounted at /etc/secrets/token.json.
      # Upload the OAuth token via the Render dashboard (Service → Environment →
      # Secret Files). Without this, Drive upload silently no-ops per design.
      - key: GOOGLE_DRIVE_TOKEN_JSON
        value: /etc/secrets/token.json
    disk:
      name: n2o-data-worker
      mountPath: /data
      sizeGB: 1

  - type: web
    name: n2o-dvr-frontend
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://n2o-dvr-api.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://dvr-sicurezza.it
      - key: AUTH_TRUST_HOST
        value: "true"  # Auth.js v5 requires this behind Render's reverse proxy (UntrustedHost error otherwise)

  - type: redis
    name: n2o-dvr-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []  # internal-only; reached by n2o-dvr-api + n2o-dvr-worker over private network
